<body>
<!-- netwarden dashboard shell. Every visible string comes from netwarden/locales/<code>.json
     (GET /api/locale) and is filled in by app.js; nothing here talks to anything but this server. -->
<a class="skip" href="#main" data-i18n="app.skip"></a>

<div class="app">
  <aside class="side">
    <a class="brand" href="#/overview"><span class="logo" aria-hidden="true"></span><span class="bn">net<b>warden</b></span></a>
    <nav id="nav" class="nav" data-i18n-aria="app.nav_label"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <div class="mainwrap">
    <header class="top">
      <a class="brand brand-m" href="#/overview" aria-label="netwarden"><span class="logo" aria-hidden="true"></span><span class="bn">net<b>warden</b></span></a>
      <button type="button" class="searchbtn" id="btnPalette" aria-haspopup="dialog">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="lbl" data-i18n="app.search_open"></span><kbd id="palkbd">Ctrl K</kbd>
      </button>
      <span class="live" id="live" role="status"></span>
      <span class="updated" id="updated" aria-live="off"></span>
      <button type="button" class="btn ghost chatbtn" id="btnChat" aria-controls="chatpanel" aria-expanded="false">
        <svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg><span class="lbl" data-i18n="app.chat.open"></span>
      </button>
      <button type="button" class="btn icon ghost keysbtn" id="btnKeys" aria-haspopup="dialog" data-i18n-aria="app.sys.shortcuts">
        <svg class="ic" aria-hidden="true"><use href="#i-keyboard"/></svg>
      </button>
      <button type="button" class="btn icon ghost" id="btnRefresh" data-i18n-aria="app.refresh">
        <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
      <button type="button" class="btn icon ghost" id="btnTheme">
        <svg class="ic" aria-hidden="true"><use id="themeIcon" href="#i-auto"/></svg>
      </button>
      <select id="langsel" class="langsel" data-i18n-aria="ui.language"></select>
    </header>
    <div id="banner" class="banner" role="alert" hidden></div>
    <div id="notice" class="banner info" role="note" hidden></div>
    <!-- until the first page renders: a quiet, wordless "loading" (the words need the locale) -->
    <main id="main" tabindex="-1" aria-busy="true"><div id="view"><div class="boot-spin" aria-hidden="true"></div></div></main>
  </div>

  <nav id="bottomnav" class="bottomnav" data-i18n-aria="app.nav_label"></nav>
</div>

<div id="backdrop" class="backdrop"></div>
<!-- dialogs are <div>s: ARIA in HTML does not allow role=dialog on <aside> -->
<div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert>
  <div id="drawerbody" class="drawer-in"></div>
</div>

<!-- the AI chat beside every section (a bottom sheet on phones); not modal on desktop -->
<div id="chatscrim" class="chatscrim"></div>
<div id="chatpanel" class="chatpanel" role="dialog" aria-labelledby="chat-title" hidden>
  <div id="chatpanelbody" class="chatpanel-in"></div>
</div>

<div id="keysheet" class="palette sheet" role="dialog" aria-modal="true" aria-labelledby="keys-title" hidden>
  <div id="keysbody" class="pal-panel sheet-panel"></div>
</div>

<div id="prevsheet" class="palette sheet" role="dialog" aria-modal="true" aria-labelledby="prev-title" hidden>
  <div id="prevbody" class="pal-panel sheet-panel wide"></div>
</div>

<!-- Stage X: "Are you sure?" before an action that is not a quick, undoable note -->
<div id="confirmsheet" class="palette sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text" hidden>
  <div id="confirmbody" class="pal-panel sheet-panel"></div>
</div>

<div id="palette" class="palette" role="dialog" aria-modal="true" data-i18n-aria="app.search_open" hidden>
  <div class="pal-panel">
    <div class="pal-in">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="palq" type="text" autocomplete="off" spellcheck="false" maxlength="100" role="combobox"
             aria-expanded="true" aria-controls="pallist" aria-autocomplete="list" aria-haspopup="listbox"
             data-i18n-placeholder="app.palette_placeholder" data-i18n-aria="app.palette_placeholder">
      <kbd>Esc</kbd>
    </div>
    <ul id="pallist" class="pal-list" role="listbox" data-i18n-aria="app.search_open"></ul>
    <div class="pal-foot" data-i18n="app.palette_hint"></div>
    <div id="palcount" class="sr" aria-live="polite" aria-atomic="true"></div>
  </div>
</div>

<!-- toasts are seen here; screen readers hear them once through #say (polite) / #shout (errors) -->
<div id="toasts" class="toasts" data-i18n-aria="app.toasts_label" role="region"></div>
<div id="say" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="shout" class="sr" role="alert" aria-atomic="true"></div>
<script type="application/json" id="off-texts">__OFFLINE__</script>
<datalist id="peopleList"></datalist><datalist id="roomList"></datalist>
</body>
</html>

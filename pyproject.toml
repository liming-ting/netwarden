[project]
name = "netwarden"
# Kept equal to netwarden.__version__ (the single source of truth; a test checks it).
version = "0.1.0"
description = "Your home network explained in plain language, privacy first: devices, who they talk to (AdGuard Home / Pi-hole), optional AI (cloud, local or offline)."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression + the files that carry it (setuptools >= 77, see
# [build-system]); no "License ::" classifier, which PEP 639 forbids next to it.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "liming-ting" }]
keywords = ["home network", "dns", "adguard", "pi-hole", "privacy", "homelab",
            "home assistant", "network monitoring", "ollama", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    # Zero runtime dependencies, by decision: stdlib only (urllib for the Anthropic API
    # and ntopng, http.server for the dashboard, sqlite3 for the store).
]

[project.urls]
Homepage = "https://github.com/liming-ting/netwarden"
Documentation = "https://github.com/liming-ting/netwarden/blob/main/docs/install.md"
Issues = "https://github.com/liming-ting/netwarden/issues"
Changelog = "https://github.com/liming-ting/netwarden/blob/main/CHANGELOG.md"
Security = "https://github.com/liming-ting/netwarden/security/policy"

[project.scripts]
netwarden = "netwarden.__main__:main"
netwarden-discover = "netwarden.discovery:main"
netwarden-ingest = "netwarden.dns_ingest:main"
netwarden-traffic = "netwarden.traffic_ingest:main"
netwarden-brain = "netwarden.brain:main"
netwarden-threat = "netwarden.threatintel:main"
netwarden-alerts = "netwarden.alerts:main"
netwarden-web = "netwarden.web:main"

# setuptools: everywhere already (Debian/Raspberry Pi OS ship it), so `pip install .`,
# `pipx install .` and an offline wheel build need nothing exotic. Pure Python: no
# compiler, no build step for the dashboard.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netwarden", "netwarden.vendor"]
include-package-data = false

# The translations, the dashboard page (index.html, app.css, app.js, icons, ...) and the
# reviewed "same as English" list ship inside the wheel; i18n / web read them from there.
[tool.setuptools.package-data]
netwarden = ["locales/*.json", "static/*", "locale_same_ok.json"]

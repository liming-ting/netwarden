name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        netwarden stays read-only toward your network, has zero runtime dependencies and sends
        nothing anywhere unless you ask the AI. Ideas that fit those rules are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation at home or in your homelab, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: This does not require netwarden to change my router, firewall or DNS filter.
        - label: I searched existing issues first.
